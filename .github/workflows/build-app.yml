name: Build Whisper.app

on:
  workflow_dispatch:
  push:
    branches: [main, fork-princetholia]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build app bundle
        run: |
          chmod +x make_app.sh run.sh
          ./make_app.sh

      - name: Upload Whisper.app
        uses: actions/upload-artifact@v4
        with:
          name: Whisper-app
          path: Whisper.app
          if-no-files-found: error
